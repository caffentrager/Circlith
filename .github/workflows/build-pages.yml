name: Verify and build both Circlith modes

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Test the common editor and logic engine
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Test editing and simulation interactions
        run: npm run test:browser
      - name: Build editor mode
        run: npm run build -- --mode editor --base=/Circlith/ --outDir build/editor-dist
      - name: Build simulation mode
        run: npm run build -- --mode simulation --base=/Circlith/simulation/ --outDir build/simulation-dist
      - name: Assemble both modes from this commit
        run: node scripts/assemble-pages.mjs build/editor-dist build/simulation-dist build/pages-site
      - name: Verify both built modes and isolated settings
        run: node scripts/check-pages.mjs build/pages-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages-site
