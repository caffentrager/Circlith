name: Build and deploy both Circlith versions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the editor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name == 'feat/editor-prototype' && github.sha || 'feat/editor-prototype' }}
          path: editor
      - name: Check out the simulation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name == 'codex/logic-simulation' && github.sha || 'codex/logic-simulation' }}
          path: simulation
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            editor/package-lock.json
            simulation/package-lock.json
      - name: Install editor dependencies
        run: npm ci
        working-directory: editor
      - name: Test the editor
        run: npm test
        working-directory: editor
      - name: Install editor browser
        run: npx playwright install --with-deps chromium
        working-directory: editor
      - name: Test editor interactions
        run: npm run test:browser
        working-directory: editor
      - name: Build the editor
        run: npm run build -- --base=/Circlith/
        working-directory: editor
      - name: Install simulation dependencies
        run: npm ci
        working-directory: simulation
      - name: Test the simulation
        run: npm test
        working-directory: simulation
      - name: Install simulation browser
        run: npx playwright install --with-deps chromium
        working-directory: simulation
      - name: Test simulation interactions
        run: npm run test:browser
        working-directory: simulation
      - name: Build the simulation
        run: npm run build -- --base=/Circlith/simulation/
        working-directory: simulation
      - name: Assemble both versions and record their revisions
        run: node simulation/scripts/assemble-pages.mjs editor/dist simulation/dist site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy both versions to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
